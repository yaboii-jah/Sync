# Make a merge to `main` actually deploy, whoever wrote it.
#
# Vercel only builds when the git AUTHOR of the head commit is a member of the
# Vercel account. On a personal account that is one person — the repository
# owner — so when a collaborator's commit lands on `main` Vercel skips it
# silently: no deploy, no error, no notification. `main` looks updated and
# production is not, which is the worst shape this failure can take.
#
# On a push to `main` authored by anyone other than the repository owner, this
# pushes an empty commit authored AS the repository owner, which Vercel does
# accept. The collaborator's work then reaches production underneath an author
# Vercel recognises.
#
# ── Configuration: none ─────────────────────────────────────────────────────
#
# The owner is `github.repository_owner`, which GitHub fills in, and their
# identity is resolved from the GitHub API at run time. Nothing to set up, and
# nothing to keep in sync if the repository is ever transferred.
#
# Optional escape hatch: a `VERCEL_OWNER_EMAIL` repository variable overrides
# the derived address. Worth setting to the email the owner actually commits
# with, because that address is *proven* to deploy — their own commits already
# do. The derived `<id>+<login>@users.noreply.github.com` is GitHub's canonical
# address for the account and should be matched just as well, but "should" is
# how this bug arises in the first place, and a nudge that fails to deploy is
# indistinguishable from no nudge at all.
#
# Optional: a `DEPLOY_TOKEN` secret — a fine-grained PAT belonging to the
# repository owner with Contents: read and write. Without it the job falls back
# to GITHUB_TOKEN, which also works and additionally cannot recurse, because a
# push made with GITHUB_TOKEN never triggers another workflow run. A PAT does
# trigger one, which is why the marker guard below exists.
#
# ── If `main` is protected ──────────────────────────────────────────────────
#
# A push from CI is still a push. Either let the token's identity bypass the
# rule, or use a Vercel Deploy Hook instead — see the note at the bottom.

name: Trigger Vercel deploy

on:
  push:
    branches: [main]

# Serialised. Two overlapping runs would race to push to `main` and the loser
# would fail on a non-fast-forward.
concurrency:
  group: vercel-deploy-nudge
  cancel-in-progress: false

jobs:
  nudge:
    name: Nudge Vercel
    runs-on: ubuntu-latest

    # Two guards, both load-bearing:
    #
    #   1. Never react to our own commit. This is the recursion guard for a PAT
    #      setup, where the empty commit would otherwise retrigger this workflow.
    #   2. Do nothing when the repository owner authored the commit — Vercel
    #      deploys that one unaided, so an empty commit would be pure noise.
    if: >-
      !contains(github.event.head_commit.message, '[vercel-nudge]')
      && github.event.head_commit.author.username != github.repository_owner

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          # Full history: pushing from a shallow clone is rejected.
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve the repository owner's commit identity
        id: owner
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OVERRIDE_EMAIL: ${{ vars.VERCEL_OWNER_EMAIL }}
        run: |
          set -euo pipefail

          login="$(gh api "users/${OWNER}" --jq .login)"
          id="$(gh api "users/${OWNER}" --jq .id)"

          if [ -z "${login}" ] || [ -z "${id}" ]; then
            echo "::error::Could not resolve the GitHub identity for '${OWNER}'. Without it this job would commit as the runner's default identity, which Vercel skips exactly like the commit this job exists to fix."
            exit 1
          fi

          # The numeric id matters in the derived form. GitHub links a commit to
          # an account through `<id>+<login>@users.noreply.github.com`; the
          # login-only variant is unreliable on newer accounts, and an address
          # GitHub cannot map to a user is one Vercel cannot match either.
          if [ -n "${OVERRIDE_EMAIL}" ]; then
            email="${OVERRIDE_EMAIL}"
            echo "Using VERCEL_OWNER_EMAIL override."
          else
            email="${id}+${login}@users.noreply.github.com"
            echo "Using GitHub's derived noreply address. If a nudged commit lands on main but Vercel still does not build, set the VERCEL_OWNER_EMAIL variable to the address the owner commits with — that is the first thing to check."
          fi

          echo "name=${login}" >> "$GITHUB_OUTPUT"
          echo "email=${email}" >> "$GITHUB_OUTPUT"

      - name: Push an empty commit authored by the repository owner
        env:
          OWNER_NAME: ${{ steps.owner.outputs.name }}
          OWNER_EMAIL: ${{ steps.owner.outputs.email }}
          TRIGGERED_BY: ${{ github.event.head_commit.author.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  "${OWNER_NAME}"
          git config user.email "${OWNER_EMAIL}"

          git commit --allow-empty \
            -m "chore(deploy): trigger Vercel build [vercel-nudge]" \
            -m "Empty commit so Vercel builds ${SOURCE_SHA}, which was authored by ${TRIGGERED_BY}. Vercel only deploys when the git author of the head commit belongs to the Vercel account."

          git push origin HEAD:main

          {
            echo "### Vercel deploy nudged"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Authored by: ${TRIGGERED_BY}"
            echo "- Nudged as: ${OWNER_NAME} <${OWNER_EMAIL}>"
          } >> "$GITHUB_STEP_SUMMARY"

# ── Simpler alternative ─────────────────────────────────────────────────────
#
# A Vercel Deploy Hook is a URL you POST to. No token, no authorship, cannot
# recurse, leaves no empty commits:
#
#   Vercel → Project → Settings → Git → Deploy Hooks → create one for `main`
#
# then replace the last two steps with:
#
#   - run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
#
# The empty commit is the default here because it leaves the deploy visible in
# git history — which is what you want when a deploy goes missing and you are
# trying to work out why.
